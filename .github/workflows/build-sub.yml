name: Build Subscription

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "subscribe.txt"
      - ".timestamp"
      - "stats.json"
      - "output/**"
  workflow_dispatch:

concurrency:
  group: freedom-subscription-build
  cancel-in-progress: false

env:
  MAX_EXTERNAL: 2500
  MAX_PER_PROTOCOL: 100
  VALIDATION_WORKERS: 24
  VALIDATION_TIMEOUT: 8
  HISTORY_LIMIT: 30
  XRAY_VERSION: latest
  SING_BOX_VERSION: latest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test pipeline
        run: |
          python -m py_compile scripts/freedom.py
          python -m unittest discover -s tests -v
          bash -n scripts/*.sh

      - name: Install proxy cores
        run: bash scripts/install-cores.sh

      - name: Download external subscriptions
        run: bash scripts/download.sh

      - name: Parse and normalize configurations
        run: bash scripts/parse.sh

      - name: Validate configurations
        run: bash scripts/validate.sh

      - name: Generate subscriptions and statistics
        run: bash scripts/publish.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f subscribe.txt output stats.json .timestamp
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update subscription $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin HEAD:main
          fi
