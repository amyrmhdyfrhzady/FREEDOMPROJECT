name: Build Subscription

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "subscribe.txt"
      - ".timestamp"
      - "stats.json"
      - "output/**"
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Optional HTTP(S) subscription URL to add before this build'
        required: false
        type: string
      remove_zero_health_sources:
        description: 'Remove downloaded sources with zero healthy configs'
        required: false
        default: false
        type: boolean

concurrency:
  group: freedom-subscription-build
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  MAX_EXTERNAL: 500
  MAX_PER_PROTOCOL: 100
  VALIDATION_WORKERS: 64
  VALIDATION_TIMEOUT: 7
  HISTORY_LIMIT: 2
  REMOVE_ZERO_HEALTH_SOURCES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.remove_zero_health_sources == 'true' }}
  XRAY_VERSION: latest
  SING_BOX_VERSION: latest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test pipeline
        run: |
          python -m py_compile scripts/freedom.py
          python -m unittest discover -s tests -v
          bash -n scripts/*.sh

      - name: Install proxy cores
        run: bash scripts/install-cores.sh

      - name: Add optional subscription source
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_url != '' }}
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
        run: |
          python - <<'PY'
          import os, pathlib, urllib.parse
          value = os.environ.get('SOURCE_URL', '').strip()
          parsed = urllib.parse.urlparse(value)
          if parsed.scheme not in ('http', 'https') or not parsed.netloc:
              raise SystemExit('SOURCE_URL must be a valid HTTP(S) URL')
          path = pathlib.Path('configs/external-sources.list')
          lines = path.read_text(encoding='utf-8-sig').splitlines() if path.exists() else []
          if value not in [line.strip() for line in lines]:
              lines.append(value)
              path.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')
              print('Subscription source added')
          else:
              print('Subscription source already exists')
          PY

      - name: Download external subscriptions
        run: bash scripts/download.sh

      - name: Parse and normalize configurations
        run: bash scripts/parse.sh

      - name: Validate configurations
        run: bash scripts/validate.sh

      - name: Generate subscriptions and statistics
        run: bash scripts/publish.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f subscribe.txt output stats.json .timestamp configs/external-sources.list
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update subscription $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin HEAD:main
          fi
